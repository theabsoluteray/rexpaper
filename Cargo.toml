[package]
name = "rexpaper"
version = "0.1.0"
edition = "2024"
description = "A fast, native wallpaper manager for Windows and Hyprland, built with Rust + Slint"
license = "GPL-3.0"
repository = "https://github.com/theabsoluteray/rexpaper"

[dependencies]
slint = { version = "1.17", features = ["raw-window-handle-06"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync"] }
image = "0.25"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"
raw-window-handle = "0.6"
git2 = "0.20"
rfd = "0.15"

# Windows-only OS integration (SystemParametersInfoW, DWM backdrop)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux/Hyprland integration uses std::process::Command -- no extra deps.

[build-dependencies]
slint-build = "1.17"
rfd = "0.15"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
