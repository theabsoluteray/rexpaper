[package]
name = "rexpaper"
version = "1.0.1"
edition = "2024"
description = "A fast, native wallpaper manager for Windows with mpv live wallpapers, built with Rust + Slint"
license = "GPL-3.0"
repository = "https://github.com/theabsoluteray/rexpaper"
categories = ["desktop-environment", "multimedia", "gui"]
keywords = ["wallpaper", "live-wallpaper", "mpv", "slint"]

[dependencies]
slint = { version = "1.17", features = ["raw-window-handle-06"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync"] }
image = "0.25"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"
raw-window-handle = "0.6"
rfd = "0.15"
libmpv = { version = "2", features = ["render"] }
directories = "5.0"
which = "6.0"
rayon = "1.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
] }

[build-dependencies]
slint-build = "1.17"
rfd = "0.15"
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true