name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset --version 3.11.2 --no-progress
          refreshenv

      - name: Download and prepare mpv runtime and dev lib
        run: |
          $headers = @{"User-Agent" = "RexPaper-CI"}
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest" -Headers $headers
          $runtimeAsset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-.*\.7z$' } | Select-Object -First 1
          $devAsset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-.*\.7z$' } | Select-Object -First 1

          if (-not $runtimeAsset) { throw "mpv runtime asset not found" }
          if (-not $devAsset) { throw "mpv dev asset not found" }

          Write-Host "Downloading runtime: $($runtimeAsset.browser_download_url)"
          curl.exe -L -o "mpv-runtime.7z" $runtimeAsset.browser_download_url
          7z x "mpv-runtime.7z" "-ompv-runtime" -y

          Write-Host "Downloading dev package: $($devAsset.browser_download_url)"
          curl.exe -L -o "mpv-dev.7z" $devAsset.browser_download_url
          7z x "mpv-dev.7z" "-ompv-dev" -y

          New-Item -ItemType Directory -Path ./mpv -Force | Out-Null
          if (Test-Path ./mpv-runtime/mpv.exe) { Copy-Item ./mpv-runtime/mpv.exe ./mpv/ -Force }
          if (Test-Path ./mpv-runtime/mpv.com) { Copy-Item ./mpv-runtime/mpv.com ./mpv/ -Force }

          $dll = Get-ChildItem -Path ./mpv-dev -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in dev package" }
          Copy-Item $dll.FullName ./mpv/libmpv-2.dll -Force

          $libDir = "./mpv-lib"
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw "MSVC dumpbin.exe not found" }
          $defPath = "$libDir\mpv.def"
          $defLines = "EXPORTS"
          foreach ($line in (& $dumpbin.FullName /exports $dll.FullName)) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)$') {
              $name = $Matches[1]
              if ($name -like 'mpv_*') { $defLines += "`r`n    $name" }
            }
          }
          Set-Content -Path $defPath -Value $defLines -NoNewline

          $libExe = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $libExe) { throw "MSVC lib.exe not found" }
          & $libExe.FullName "/def:$defPath" "/name:libmpv-2.dll" "/out:$libDir\mpv.lib" "/MACHINE:X64" 2>&1 | Out-Host
          if (-not (Test-Path "$libDir\mpv.lib")) { throw "mpv.lib generation failed" }

          ls ./mpv/
          ls $libDir

      - name: Build release
        run: cargo build --release
        env:
          MPV_LIB_DIR: ./mpv-lib

      - name: Stage release dependencies
        run: |
          Copy-Item ./mpv/mpv.exe target/release/ -Force
          Copy-Item ./mpv/libmpv-2.dll target/release/ -Force
          Copy-Item ./mpv/libmpv-2.dll target/release/mpv.dll -Force
          Copy-Item ./mpv/mpv.com target/release/ -Force -ErrorAction SilentlyContinue
          ls target/release/

      - name: Build MSI with WiX
        run: |
          New-Item -ItemType Directory -Path "wix\obj" -Force | Out-Null
          
          candle.exe -out "wix\obj\main.wixobj" "wix\main.wxs"
          
          light.exe -out "RexPaper-x64.msi" `
            "wix\obj\main.wixobj" `
            -ext WixUIExtension `
            -cultures:en-us

      - name: Create Portable Zip Package
        run: |
          $portableDir = "RexPaper-Portable-x64"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item target/release/rexpaper.exe $portableDir/
          Copy-Item target/release/libmpv-2.dll $portableDir/
          Copy-Item target/release/mpv.dll $portableDir/
          Copy-Item target/release/mpv.exe $portableDir/
          Copy-Item target/release/mpv.com $portableDir/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse assets $portableDir/
          Copy-Item README.md $portableDir/
          Copy-Item LICENSE $portableDir/
          Compress-Archive -Path "$portableDir\*" -DestinationPath "RexPaper-Portable-x64.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RexPaper-Windows-x64
          path: |
            RexPaper-*.msi
            RexPaper-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RexPaper-*.msi
            RexPaper-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}