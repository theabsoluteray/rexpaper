[package]
name = "rexpaper-core"
version = "1.0.3"
edition = "2024"
description = "UI-free core engine for RexPaper: scanning, thumbnails, wallpaper application, platform integration"
license = "GPL-3.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
image = "0.25"
rayon = "1.10"
directories = "5.0"
which = "6.0"
uuid = { version = "1", features = ["v4", "fast-rng"] }
libmpv = { version = "2", features = ["render"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
